name: Deploy EcoCat to GitHub Pages

# Exporta o projeto Godot para Web (HTML5) e publica no GitHub Pages
# a cada push na branch main. Tambem pode ser disparado manualmente.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# So um deploy por vez; nao cancela um deploy em andamento.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Versao da Godot. Tem que bater com a imagem barichello/godot-ci usada no job.
  # Se trocar aqui, troque tambem a tag "image:" abaixo (ex.: barichello/godot-ci:4.5).
  GODOT_VERSION: "4.5"
  # Pasta onde fica o project.godot (a raiz do projeto Godot).
  PROJECT_PATH: "docs"

jobs:
  build:
    name: Exportar Web
    runs-on: ubuntu-latest
    container:
      # IMPORTANTE: a tag tem que ser a mesma versao de GODOT_VERSION.
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Exportar para Web
        run: |
          mkdir -v -p build/web
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Garantir que existe index.html
        run: |
          test -f build/web/index.html || (echo "ERRO: export nao gerou index.html" && exit 1)

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
