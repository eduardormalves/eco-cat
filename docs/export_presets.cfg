html/head_include="<style>
#ecocat-rotate{position:fixed;inset:0;z-index:2147483647;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;box-sizing:border-box;background:#2f5a22;color:#f4f9ee;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
#ecocat-rotate.show{display:flex}
#ecocat-rotate h1{margin:0;font-size:26px}
#ecocat-rotate p{margin:0;max-width:320px;font-size:17px;line-height:1.45}
</style>
<script>
/* EcoCat no celular: o jogo e SEMPRE na horizontal.
   - Celular em pe: a pagina inteira (carregamento + menu + jogo) e desenhada
     girada 90 graus, entao o jogo ja abre deitado e o jogador so vira o
     celular. O Godot passa a enxergar a tela deitada (innerWidth/innerHeight
     trocados) e cada toque/clique e desvirado antes de o Godot ler.
   - No primeiro toque tenta tela cheia + trava em paisagem (Android/Chrome).
   - No computador nada muda. */
(function () {
  var ua = navigator.userAgent;
  var mobile = /Android|iPhone|iPad|iPod/i.test(ua)
    || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua))
    || window.matchMedia('(pointer: coarse)').matches;
  if (!mobile) { return; }

  var portrait = window.matchMedia('(orientation: portrait)');

  function findDesc(obj, name) {
    while (obj) {
      var d = Object.getOwnPropertyDescriptor(obj, name);
      if (d) { return d; }
      obj = Object.getPrototypeOf(obj);
    }
    return null;
  }
  var dW = findDesc(window, 'innerWidth');
  var dH = findDesc(window, 'innerHeight');
  function realW() { return dW && dW.get ? dW.get.call(window) : document.documentElement.clientWidth; }
  function realH() { return dH && dH.get ? dH.get.call(window) : document.documentElement.clientHeight; }

  /* O Godot mede a tela por innerWidth/innerHeight: em pe, troca os dois. */
  var canRotate = false;
  try {
    Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return isRot() ? realH() : realW(); } });
    Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return isRot() ? realW() : realH(); } });
    canRotate = true;
  } catch (e) {
    try { if (dW) { Object.defineProperty(window, 'innerWidth', dW); } } catch (e2) {}
  }
  function isRot() { return canRotate && portrait.matches; }

  /* Toque/clique na tela em pe (x, y) vira (y, W - x) no jogo deitado. */
  var MX = findDesc(MouseEvent.prototype, 'clientX'), MY = findDesc(MouseEvent.prototype, 'clientY');
  var MMX = findDesc(MouseEvent.prototype, 'movementX'), MMY = findDesc(MouseEvent.prototype, 'movementY');
  var TX = window.Touch ? findDesc(Touch.prototype, 'clientX') : null;
  var TY = window.Touch ? findDesc(Touch.prototype, 'clientY') : null;

  function turn(obj, nx, ny, dx, dy, neg) {
    if (!dx || !dy) { return; }
    Object.defineProperty(obj, nx, { configurable: true, get: function () {
      return isRot() ? dy.get.call(this) : dx.get.call(this);
    } });
    Object.defineProperty(obj, ny, { configurable: true, get: function () {
      if (!isRot()) { return dy.get.call(this); }
      return neg ? -dx.get.call(this) : realW() - dx.get.call(this);
    } });
  }

  function onPointer(e) {
    if (!isRot()) { return; }
    try {
      if (e.changedTouches) {
        var lists = [e.changedTouches, e.touches, e.targetTouches];
        for (var l = 0; l < lists.length; l++) {
          var list = lists[l];
          if (!list) { continue; }
          for (var i = 0; i < list.length; i++) { turn(list[i], 'clientX', 'clientY', TX, TY, false); }
        }
      } else {
        turn(e, 'clientX', 'clientY', MX, MY, false);
        turn(e, 'movementX', 'movementY', MMX, MMY, true);
      }
    } catch (err) {}
  }
  ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'mousedown', 'mousemove', 'mouseup', 'click', 'dblclick', 'wheel', 'contextmenu'].forEach(function (t) {
    window.addEventListener(t, onPointer, { capture: true, passive: true });
  });

  /* O retangulo do canvas que o Godot usa para converter toques: o deitado. */
  function patchCanvas() {
    var c = document.getElementById('canvas');
    if (!c || c.ecoRect) { return; }
    c.ecoRect = true;
    var orig = c.getBoundingClientRect;
    c.getBoundingClientRect = function () {
      if (!isRot()) { return orig.call(this); }
      var w = realH(), h = realW();
      return { x: 0, y: 0, left: 0, top: 0, right: w, bottom: h, width: w, height: h };
    };
  }

  var overlay = null;
  var lastKey = '';
  function layout() {
    var b = document.body;
    if (!b) { return; }
    patchCanvas();
    if (!canRotate) {
      /* Reserva: navegador nao deixou girar -> pede para virar o celular. */
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'ecocat-rotate';
        overlay.innerHTML = '<h1>Gire o celular</h1><p>O EcoCat só funciona na horizontal. Vire o celular de lado para jogar.</p>';
        b.appendChild(overlay);
      }
      overlay.className = portrait.matches ? 'show' : '';
      return;
    }
    var rot = isRot();
    var W = realW(), H = realH();
    var key = rot ? W + 'x' + H : 'off';
    if (key === lastKey) { return; }
    lastKey = key;
    var s = b.style;
    if (rot) {
      s.position = 'fixed';
      s.left = '0';
      s.top = '0';
      s.width = H + 'px';
      s.height = W + 'px';
      s.transformOrigin = '0 0';
      s.transform = 'translate(' + W + 'px, 0) rotate(90deg)';
    } else {
      s.position = s.left = s.top = s.width = s.height = s.transformOrigin = s.transform = '';
    }
  }

  /* Bonus no Android: o primeiro toque poe em tela cheia e trava deitado. */
  var root = document.documentElement;
  var canLock = !!((root.requestFullscreen || root.webkitRequestFullscreen) && screen.orientation && screen.orientation.lock);
  var failed = false;
  var busy = false;
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  /* Alguns navegadores nunca respondem ao pedido: sem resposta em 1,5 s desiste. */
  function settle(p, ms) {
    return new Promise(function (ok, fail) {
      var t = setTimeout(function () { fail(new Error('timeout')); }, ms);
      Promise.resolve(p).then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); fail(e); });
    });
  }
  function goLandscape() {
    if (busy || !canLock || failed) { return; }
    busy = true;
    var req;
    try {
      if (!isFull()) {
        req = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) : root.webkitRequestFullscreen();
      }
    } catch (e) { req = Promise.reject(e); }
    settle(req, 1500).then(function () {
      return settle(screen.orientation.lock('landscape'), 1500);
    }).catch(function () { failed = true; }).then(function () { busy = false; layout(); });
  }
  function onGesture() {
    if (portrait.matches || !isFull()) { goLandscape(); }
  }
  function onFullChange() {
    if (!canLock || !isFull()) { return; }
    screen.orientation.lock('landscape').then(layout, function () {});
  }

  window.addEventListener('touchend', onGesture, true);
  window.addEventListener('pointerup', onGesture, true);
  document.addEventListener('fullscreenchange', onFullChange);
  document.addEventListener('webkitfullscreenchange', onFullChange);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (portrait.addEventListener) { portrait.addEventListener('change', layout); } else { portrait.addListener(layout); }
  if (screen.orientation && screen.orientation.addEventListener) { screen.orientation.addEventListener('change', layout); }
  /* Rede de seguranca: nem todo navegador avisa a rotacao. */
  setInterval(layout, 500);
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', layout); } else { layout(); }
})();
</script>"
