html/head_include="<style>
#ecocat-rotate{position:fixed;inset:0;z-index:2147483647;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;box-sizing:border-box;background:#2f5a22;color:#f4f9ee;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;touch-action:none;-webkit-user-select:none;user-select:none}
#ecocat-rotate.show{display:flex}
#ecocat-rotate .phone{width:62px;height:104px;border:6px solid #f4f9ee;border-radius:14px;box-sizing:border-box;position:relative;animation:ecocat-turn 2.4s ease-in-out infinite}
#ecocat-rotate .phone:after{content:'';position:absolute;bottom:6px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#f4f9ee}
@keyframes ecocat-turn{0%,25%{transform:rotate(0deg)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
#ecocat-rotate h1{margin:0;font-size:26px;line-height:1.25}
#ecocat-rotate p{margin:0;max-width:320px;font-size:17px;line-height:1.45;opacity:.9}
#ecocat-rotate .btn{font-size:20px;font-weight:700;color:#2c451f;background:#9fd57e;border:4px solid #5f8c3c;border-radius:16px;padding:14px 26px}
</style>
<script>
/* EcoCat no celular: so na horizontal. No primeiro toque o jogo entra em tela
   cheia e trava a tela deitada (Android/Chrome). Onde o navegador nao deixa
   travar (iPhone), um aviso cobre o jogo enquanto o celular estiver em pe. */
(function () {
  var ua = navigator.userAgent;
  var mobile = /Android|iPhone|iPad|iPod/i.test(ua)
    || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua))
    || window.matchMedia('(pointer: coarse)').matches;
  if (!mobile) { return; }
  var root = document.documentElement;
  var portrait = window.matchMedia('(orientation: portrait)');
  var canTry = !!((root.requestFullscreen || root.webkitRequestFullscreen) && screen.orientation && screen.orientation.lock);
  var failed = false;
  var busy = false;
  var overlay, title, text, btn;
  var shown = null, mode = null;

  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  /* Alguns navegadores (ex.: o embutido em apps) nunca respondem ao pedido:
     sem resposta em 1,5 s conta como falha, para o aviso nao travar. */
  function settle(p, ms) {
    return new Promise(function (ok, fail) {
      var t = setTimeout(function () { fail(new Error('timeout')); }, ms);
      Promise.resolve(p).then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); fail(e); });
    });
  }

  /* So mexe na pagina quando algo muda (e chamado tambem por um timer). */
  function render() {
    if (!overlay) { return; }
    var auto = canTry && !failed;
    if (auto !== mode) {
      mode = auto;
      title.textContent = auto ? 'Jogue na horizontal' : 'Gire o celular';
      text.textContent = auto
        ? 'O EcoCat é jogado com o celular deitado. Toque na tela para virar.'
        : 'O EcoCat só funciona na horizontal. Vire o celular de lado para jogar.';
      btn.style.display = auto ? '' : 'none';
    }
    var show = portrait.matches;
    if (show !== shown) {
      shown = show;
      overlay.className = show ? 'show' : '';
    }
  }

  function goLandscape() {
    if (busy || !canTry || failed) { return; }
    busy = true;
    var req;
    try {
      if (!isFull()) {
        req = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) : root.webkitRequestFullscreen();
      }
    } catch (e) { req = Promise.reject(e); }
    settle(req, 1500).then(function () {
      return settle(screen.orientation.lock('landscape'), 1500);
    }).catch(function () {
      if (portrait.matches) { failed = true; }
    }).then(function () { busy = false; render(); });
  }

  /* Gesto real do jogador (exigido pelo navegador): reforca tela cheia + paisagem. */
  function onGesture() {
    if (portrait.matches || !isFull()) { goLandscape(); }
  }

  function build() {
    overlay = document.createElement('div');
    overlay.id = 'ecocat-rotate';
    var phone = document.createElement('div');
    phone.className = 'phone';
    title = document.createElement('h1');
    text = document.createElement('p');
    btn = document.createElement('div');
    btn.className = 'btn';
    btn.textContent = 'Toque para virar a tela';
    overlay.appendChild(phone);
    overlay.appendChild(title);
    overlay.appendChild(text);
    overlay.appendChild(btn);
    document.body.appendChild(overlay);
    render();
  }

  /* Tela cheia que entrou atrasada: trava a orientacao agora (nao precisa de toque). */
  function onFullChange() {
    if (!canTry || !isFull()) { return; }
    screen.orientation.lock('landscape').then(function () { failed = false; render(); }, function () {});
  }

  window.addEventListener('touchend', onGesture, true);
  window.addEventListener('pointerup', onGesture, true);
  document.addEventListener('fullscreenchange', onFullChange);
  document.addEventListener('webkitfullscreenchange', onFullChange);
  if (portrait.addEventListener) { portrait.addEventListener('change', render); } else { portrait.addListener(render); }
  window.addEventListener('resize', render);
  window.addEventListener('orientationchange', render);
  if (screen.orientation && screen.orientation.addEventListener) { screen.orientation.addEventListener('change', render); }
  /* Rede de seguranca: nem todo navegador avisa a rotacao; nunca deixa jogar em pe. */
  setInterval(render, 500);
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', build); } else { build(); }
})();
</script>"
